<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Audio Captions</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAmElEQVRYR+2WQQqAMAwExyT+/zO7gQ7I4NhbIAbqE/g4wMNAYgBKBZTybgAA7r5UACgVUMq7AQC4+1IBoFRAKe8GAODuSwWAUgGlvBsAgLsvFQCKBVTybgAA7r5UACgVUMq7AQC4+1IBoFRAKe8GAODuSwWAUgGlvBsAgLsvFQCKBVTybgAA7r5UACgVUMq7AQC4+1IBoFRANc0B4E3h1rUAAAAASUVORK5CYII=">
  <style>
    .disclaimer-banner {
      background-color: #000000;
      color: #ffffff;
      text-align: center;
      padding: 5px 0;
      font-size: 14px;
      font-weight: bold;
      position: relative;
      z-index: 1000;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      background-color: #333;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .header h1 {
      font-size: 16px;
      margin-right: 10px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-grow: wrap;
    }
    select, button {
      padding: 8px;
      border-radius: 4px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    #deviceSelect, #languageSelect {
      background: #444;
      color: #fff;
      min-width: 120px;
    }
    button {
      background: #007bff;
      color: #fff;
    }
    button:hover:not(:disabled) {
      background: #0056b3;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    #status {
      font-size: 12px;
      margin-left: auto;
      color: #ccc;
    }
    .status-active {
      color: #28a745 !important;
    }
    #transcript {
      flex-grow: 1;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      overflow-y: auto;
      font-size: 22px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 150px;
      scroll-behavior: smooth;
    }
    #transcript .line {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 6px;
      width: 100%;
    }
    #transcript .word {
      display: inline-block;
      margin-right: 8px;
      opacity: 1;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    #transcript .word:hover {
      background-color: rgba(255,255,255,0.1);
      border-radius: 3px;
    }
    #transcript .interim {
      opacity: 0.6; /* Visual cue for interim words */
    }
    #transcript .low-confidence {
      color: #ffcc00;
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .controls {
        flex-direction: column;
        width: 100%;
      }
      #deviceSelect, #languageSelect, button {
        width: 100%;
      }
      #transcript {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="disclaimer-banner">
    Notice: Real-time speech recognition may contain errors. Transcription accuracy varies based on audio quality and speech clarity.
  </div>
  <div class="header">
    <h1>Live Audio Captions</h1>
    <div class="controls">
      <select id="deviceSelect">
        <option value="">Select Audio Input</option>
      </select>
      <select id="languageSelect">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-AU">English (Australia)</option>
        <option value="en-IN">English (India)</option>
        <option value="en-CA">English (Canada)</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
      </select>
      <button id="startBtn">Start Captions</button>
      <button id="stopBtn" disabled>Stop Captions</button>
      <div id="status">Ready</div>
    </div>
  </div>
  <div id="transcript">
    <div class="line"><span class="word">Select an audio input device and click "Start Captions" to begin.</span></div>
  </div>

  <script>
    (function() {
      const deviceSelect = document.getElementById('deviceSelect');
      const languageSelect = document.getElementById('languageSelect');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const transcriptDiv = document.getElementById('transcript');
      const statusDiv = document.getElementById('status');
      
      let recognition = null;
      let stream = null;
      let isActive = false;
      let finalTranscript = '';
      let processedTranscripts = new Set(); // Track processed final transcripts
      let interimWords = []; // Track current interim words
      let interimTimeout = null; // Debounce interim updates
      
      // Optimized settings
      const maxLineLength = 75;
      const maxLines = 4;
      const interimDebounceMs = 100; // Debounce interim updates
      
      // Expanded vocabulary for better accuracy
      const commonWords = new Set([
        'the', 'and', 'for', 'are', 'may', 'but', 'you', 'all', 'can', 'had',
        'her', 'was', 'one', 'our', 'out', 'day', 'get', 'has', 'him', 'his',
        'how', 'its', 'new', 'now', 'old', 'see', 'two', 'who', 'did', 'this', 'that',
        'sit', 'set', 'run', 'eat', 'far', 'sea', 'eye', 'ask', 'own', 'what', 'when',
        'say', 'she', 'try', 'way', 'too', 'use', 'man', 'big', 'end', 'why',
        'let', 'put', 'tell', 'very', 'need', 'from', 'there', 'think', 'would',
        'have', 'they', 'know', 'want', 'been', 'good', 'much', 'some',
        'time', 'come', 'could', 'state', 'with', 'also', 'back', 'over'
      ]);

      // Check browser compatibility
      if (!window.isSecureContext) {
        showError('Secure connection required. Use HTTPS or localhost.');
        startBtn.disabled = true;
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showError('Speech recognition not supported. Use Chrome, Edge, or Safari.');
        startBtn.disabled = true;
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        showError('Microphone access not supported.');
        startBtn.disabled = true;
        return;
      }

      function initSpeechRecognition() {
        const rec = new SpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true; // Enable word-by-word updates
        rec.lang = languageSelect.value;
        rec.maxAlternatives = 5; // Increased for better accuracy

        rec.onstart = () => {
          updateStatus('Active', '#28a745');
          statusDiv.classList.add('status-active');
        };

        rec.onresult = (event) => {
          let interimTranscript = '';
          let finalText = '';
          
          // Process results
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const bestResult = getBestResult(result);
            
            if (result.isFinal) {
              const transcriptId = `${bestResult.transcript}_${i}`;
              if (!processedTranscripts.has(transcriptId)) {
                processedTranscripts.add(transcriptId);
                finalText += bestResult.transcript + ' ';
              }
            } else {
              interimTranscript += bestResult.transcript + ' ';
            }
          }

          // Debounce interim results to reduce flicker
          if (interimTimeout) clearTimeout(interimTimeout);
          interimTimeout = setTimeout(() => {
            // Process interim results
            if (interimTranscript.trim()) {
              processInterimResult(interimTranscript.trim());
            }
            // Process final results
            if (finalText.trim()) {
              finalTranscript += finalText;
              processFinalResult(finalText.trim());
            }
          }, interimDebounceMs);
        };

        rec.onerror = (event) => {
          console.error('Recognition error:',event.error);
          if (event.error === 'no-speech') {
            return;
          }
          const errorMessages = {
            'not-allowed': 'Microphone access denied. Please allow microphone access.',
            'audio-capture': 'No microphone detected. Please connect an audio input device.',
            'network': 'Network error. Please check your internet connection.'
          };
          showError(errorMessages[event.error] || `Error: ${errorMessages[event.error]}`);
          stopCapturing();
        };

        rec.onend = () => {
          if (isActive) {
            setTimeout(() => {
              if (recognition && isActive) {
                try {
                  recognition.start();
                } catch (error) {
                  if (error.name !== 'InvalidStateError') {
                    console.error('Restart failed:', error);
                  }
                }
              }
            }, 100);
          } else {
            updateStatus('Ready', '#ccc');
            statusDiv.classList.remove('status-active');
          }
        };

        return rec;
      }

      function getBestResult(result) {
        let bestResult = result[0];
        let bestScore = result[0].confidence || 0;

        for (let i = 1; i < result.length; i++) {
          const alternative = result[i];
          const confidence = alternative.confidence || 0;
          const transcript = alternative.transcript.toLowerCase();
          const words = transcript.split(/\s+/);
          const commonWordBonus = words.filter(word => commonWords.has(word)).length * 0.05; // Reduced bonus for balance
          const adjustedScore = confidence + commonWordBonus;

          if (adjustedScore > bestScore) {
            bestResult = alternative;
            bestScore = adjustedScore;
          }
        }

        return {
          transcript: enhanceText(bestResult.transcript),
          confidence: bestScore
        };
      }

      async function loadAudioDevices() {
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({audio: true});
          tempStream.getTracks().forEach(track => track.stop());

          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(device => device.kind === 'audioinput');

          deviceSelect.innerHTML = '<option value="">Select Audio Input</option>';

          if (audioInputs.length === 0) {
            showError('No audio input devices found.');
            startBtn.disabled = true;
            return;
          }

          audioInputs.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.textContent = device.label || `Audio Input ${index + 1}`;
            deviceSelect.appendChild(option);
          });

          if (audioInputs.length === 0) {
            deviceSelect.value = audioInputs[0].deviceId;
          }

          updateStatus('Ready', '#ccc');
          startBtn.disabled = false;

        } catch (error) {
          console.error('Error loading audio devices:', error);
          const message = error.name === 'NotAllowedError' 
            ? 'Microphone access denied. Please allow microphone access and try again.'
            : 'Failed to access audio devices.';
            showError(message);
          startBtn.disabled = true;
        }
      }

      function enhanceText(text) {
        if (!text) return '';

        text = text.trim();
        if (!text) return '';

        // Enhanced corrections
        text = text.replace(/^./, c => c.toUpperCase());
        text = text.replace(/\.\s+./g, m => m.toUpperCase());

        const corrections = {
          ' i ': ' I ',
          ' im ': ' I\'m ',
          ' ive ': ' I\'ve ',
          ' id ': ' I\'d ',
          ' ill ': ' I\'ll ',
          ' cant ': ' can\'t ',
          ' wont ': ' won\'t ',
          ' dont ': ' don\'t ',
          ' isnt ': ' isn\'t ',
          ' arent ': ' aren\'t ',
          ' wasnt ': ' wasn\'t ',
          ' werent ': ' weren\'t ',
          ' hasnt ': ' hasn\'t ',
          ' havent ': ' haven\'t ',
          ' hadnt ': ' hadn\'t ',
          ' wouldnt ': ' wouldn\'t ',
          ' shouldnt ': ' shouldn\'t ',
          ' couldnt ': ' couldn\'t ',
          ' gonna ': ' going to ',
          ' wanna ': ' want to ',
          ' kinda ': ' kind of '
        };

        Object.entries(corrections).forEach(([wrong, right]) => {
          const regex = new RegExp(wrong.replace(/'/g, '\''), 'gi');
          text = text.replace(regex, right);
        });

        return text;
      }

      function processInterimResult(text) {
        const words = text.split(/\s+/).filter(w => w);
        if (!words.length) return;

        // Remove previous interim words
        interimWords.forEach(wordSpan => wordSpan.remove());
        interimWords = [];

        // Display new interim words
        displayWords(words, true);
      }

      function processFinalResult(text) {
        // Remove interim words
        interimWords.forEach(wordSpan => wordSpan.remove());
        interimWords = [];

        const words = text.split(/\s+/).filter(w => w);
        if (words.length) {
          displayWords(words, false);
        }
      }

      function displayWords(words, isInterim) {
        let currentLine = transcriptDiv.querySelector('.line:last-child');
        if (!currentLine || currentLine.textContent.includes('Select an audio input')) {
          transcriptDiv.innerHTML = '';
          currentLine = createNewLine();
        }

        let lineLength = getCurrentLineLength(currentLine);

        words.forEach(word => {
          const wordLength = word.length + 1;

          if (lineLength + wordLength > maxLineLength) {
            currentLine = createNewLine();
            lineLength = 0;
          }

          const span = createWordSpan(word);
          if (isInterim) {
            span.classList.add('interim');
            interimWords.push(span);
          }
          currentLine.appendChild(span);
          lineLength += wordLength;
        });

        // Remove excess lines
        const lines = transcriptDiv.querySelectorAll('.line');
        if (lines.length > maxLines) {
          lines[0].remove();
        }

        transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
        cleanupProcessedTranscripts();
      }

      function createNewLine() {
        const line = document.createElement('div');
        line.className = 'line';
        transcriptDiv.appendChild(line);
        return line;
      }

      function getCurrentLineLength(line) {
        return Array.from(line.children)
          .reduce((len, span) => len + span.textContent.length, 0);
      }

      function createWordSpan(word) {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word + ' ';
        span.addEventListener('click', () => editWord(span));
        return span;
      }

      function editWord(span) {
        const currentText = span.textContent.trim();
        const newText = prompt('Edit word:', currentText);
        if (newText && newText !== currentText) {
          span.textContent = newText + ' ';
        }
      }

      function cleanupProcessedTranscripts() {
        if (processedTranscripts.size > 1000) {
          processedTranscripts.clear();
        }
      }

      async function startCapturing() {
        if (!deviceSelect.value) {
          showError('Please select an audio input device.');
          return;
        }

        try {
          stopCapturing();

          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: { exact: deviceSelect.value },
              noiseSuppression: true,
              echoCancellation: true,
              autoGainControl: true,
              sampleRate: 48000 // Higher sample rate for clarity
            }
          });

          recognition = initSpeechRecognition();
          recognition.start();
          
          isActive = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          
          transcriptDiv.innerHTML = '';
          finalTranscript = '';
          processedTranscripts.clear();
          interimWords = [];
          
        } catch (error) {
          console.error('Error starting capture:', error);
          const errorMessages = {
            'NotAllowedError': 'Microphone access denied.',
            'NotFoundError': 'Selected audio device not found.',
            'OverconstrainedError': 'Selected audio device not available.'
          };
          showError(errorMessages[error.name] || `Error: ${error.message}`);
          stopCapturing();
        }
      }

      function stopCapturing() {
        isActive = false;
        finalTranscript = '';
        processedTranscripts.clear();
        interimWords.forEach(wordSpan => wordSpan.remove());
        interimWords = [];
        if (interimTimeout) clearTimeout(interimTimeout);

        if (recognition) {
          try {
            recognition.stop();
          } catch (error) {
            console.error('Error stopping recognition:', error);
          }
          recognition = null;
        }

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        startBtn.disabled = false;
        stopBtn.disabled = true;
        updateStatus('Ready', '#ccc');
        if (transcriptDiv.children.length > 0) {
          const line = createNewLine();
          const span = createWordSpan('[Captions stopped]');
          span.style.color = '#888';
          span.style.fontStyle = 'italic';
          line.appendChild(span);
        }
      }

      function updateStatus(message, color) {
        statusDiv.textContent = message;
        statusDiv.style.color = color;
      }

      function showError(message) {
        updateStatus(`Error: ${message}`, '#dc3545');
        statusDiv.classList.remove('status-active');
      }

      // Event listeners
      startBtn.addEventListener('click', startCapturing);
      stopBtn.addEventListener('click', stopCapturing);
      
      languageSelect.addEventListener('change', () => {
        if (isActive) {
          stopCapturing();
          setTimeout(startCapturing, 100);
        }
      });

      navigator.mediaDevices.addEventListener('devicechange', loadAudioDevices);

      // Initialize
      loadAudioDevices();
      
    })();
  </script>
</body>
</html>
