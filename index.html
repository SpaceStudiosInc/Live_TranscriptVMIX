<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Audio Captions</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAmElEQVRYR+2WQQqAMAwExyT+/zO7gQ7I4NhbIAbqE/g4wMNAYgBKBZTybgAA7r5UACgVUMq7AQC4+1IBoFRAKe8GAODuSwWAUgGlvBsAgLsvFQCKBVTybgAA7r5UACgVUMq7AQC4+1IBoFRAKe8GAODuSwWAUgGlvBsAgLsvFQCKBVTybgAA7r5UACgVUMq7AQC4+1IBoFRANc0B4E3h1rUAAAAASUVORK5CYII=">
  <style>
    .disclaimer-banner {
      background-color: #000000;
      color: #ffffff;
      text-align: center;
      padding: 5px 0;
      font-size: 14px;
      font-weight: bold;
      position: relative;
      z-index: 1000;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      background-color: #333;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .header h1 {
      font-size: 16px;
      margin-right: 10px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      padding: 8px;
      border-radius: 4px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    #deviceSelect, #languageSelect {
      background: #444;
      color: #fff;
      min-width: 120px;
    }
    button {
      background: #007bff;
      color: #fff;
    }
    button:hover:not(:disabled) {
      background: #0056b3;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    #status {
      font-size: 12px;
      margin-left: auto;
      color: #ccc;
    }
    .status-active {
      color: #28a745 !important;
    }
    #transcript {
      flex-grow: 1;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      overflow-y: auto;
      font-size: 22px;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 150px;
      scroll-behavior: smooth;
      width: 100%;
    }
    #transcript .line {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 6px;
      width: 100%;
      justify-content: flex-start;
    }
    #transcript .word {
      display: inline-block;
      margin-right: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }
    #transcript .word:hover {
      background-color: rgba(255,255,255,0.1);
      border-radius: 3px;
    }
    #transcript .low-confidence {
      color: #ffcc00;
      text-decoration: underline;
    }
    #transcript .interim {
      color: #888;
    }
    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .controls {
        flex-direction: column;
        width: 100%;
      }
      #deviceSelect, #languageSelect, button {
        width: 100%;
      }
      #transcript {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="disclaimer-banner">
    Notice: Real-time speech recognition may contain errors. Transcription accuracy varies based on audio quality and speech clarity.
  </div>
  <div class="header">
    <h1>Live Audio Captions</h1>
    <div class="controls">
      <select id="deviceSelect">
        <option value="">Select Audio Input</option>
      </select>
      <select id="languageSelect">
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="en-AU">English (Australia)</option>
        <option value="en-IN">English (India)</option>
        <option value="en-CA">English (Canada)</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
        <option value="de-DE">German</option>
      </select>
      <button id="startBtn">Start Captions</button>
      <button id="stopBtn" disabled>Stop Captions</button>
      <div id="status">Ready</div>
    </div>
  </div>
  <div id="transcript">
    <div class="line"><span class="word">Select an audio input device and click "Start Captions" to begin.</span></div>
  </div>

  <script>
    (function() {
      const deviceSelect = document.getElementById('deviceSelect');
      const languageSelect = document.getElementById('languageSelect');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const transcriptDiv = document.getElementById('transcript');
      const statusDiv = document.getElementById('status');
      
      let recognition = null;
      let stream = null;
      let isActive = false;
      let finalTranscript = '';
      let interimTranscript = '';
      let lastUpdateTime = 0;
      const updateInterval = 2000; // 2 seconds
      const maxLineLength = 100;
      const maxLines = 2;

      const commonWords = new Set([
        'the', 'and', 'for', 'are', 'may', 'but', 'you', 'all', 'can', 'had',
        'her', 'was', 'one', 'our', 'out', 'day', 'get', 'has', 'him', 'his',
        'how', 'its', 'new', 'now', 'old', 'see', 'two', 'who', 'did', 'this', 'that',
        'sit', 'set', 'run', 'eat', 'far', 'sea', 'eye', 'ask', 'own', 'what', 'when',
        'say', 'she', 'try', 'way', 'too', 'use', 'man', 'big', 'end', 'why',
        'let', 'put', 'tell', 'very', 'need', 'from', 'there', 'think', 'would',
        'have', 'they', 'know', 'want', 'been', 'good', 'much', 'some',
        'time', 'come', 'could', 'state', 'with', 'also', 'back', 'over'
      ]);

      const profanityFilter = new Set([
        'fuck', 'shit', 'damn', 'dammit', 'ass', 'asshole', 'bitch', 'bastard',
        'cunt', 'dick', 'prick', 'piss', 'pussy', 'cock', 'fucker', 'motherfucker',
        'shithead', 'douche', 'douchebag', 'crap', 'bullshit', 'fucking', 'goddamn',
        'arse', 'bollocks', 'bugger', 'wanker', 'sod', 'twat', 'knob', 'shite',
        'arsehole', 'dickhead', 'pissed', 'son of a bitch', 'faggot', 'nigger',
        'chink', 'spic', 'kike', 'retard', 'slut', 'whore', 'hoe', 'skank',
        'cum', 'jizz', 'tits', 'boobs', 'fag', 'dyke', 'queer'
      ]);

      if (!window.isSecureContext) {
        showError('Secure connection required. Use HTTPS or localhost.');
        startBtn.disabled = true;
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showError('Speech recognition not supported. Use Chrome, Edge, or Safari.');
        startBtn.disabled = true;
        return;
      }

      if (!navigator.mediaDevices?.getUserMedia) {
        showError('Microphone access not supported.');
        startBtn.disabled = true;
        return;
      }

      function initSpeechRecognition() {
        const rec = new SpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true; // Enable interim results
        rec.lang = languageSelect.value;
        rec.maxAlternatives = 5;

        rec.onstart = () => {
          updateStatus('Active', '#28a745');
          statusDiv.classList.add('status-active');
        };

        rec.onresult = (event) => {
          let interimText = '';
          let finalText = '';

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const bestResult = getBestResult(result);
            if (result.isFinal) {
              finalText += bestResult.transcript + ' ';
            } else {
              interimText += bestResult.transcript + ' ';
            }
          }

          const currentTime = Date.now();
          if (finalText.trim()) {
            finalTranscript += finalText;
            processTranscript(finalText.trim(), true);
            interimTranscript = '';
            lastUpdateTime = currentTime;
          } else if (interimText.trim() && (currentTime - lastUpdateTime >= updateInterval)) {
            interimTranscript = interimText;
            processTranscript(interimText.trim(), false);
            lastUpdateTime = currentTime;
          }
        };

        rec.onerror = (event) => {
          console.error('Recognition error:', event.error);
          if (event.error === 'no-speech') {
            cleanupEmptyLines();
            return;
          }
          const errorMessages = {
            'not-allowed': 'Microphone access denied. Please allow microphone access.',
            'audio-capture': 'No microphone detected. Please connect an audio input device.',
            'network': 'Network error. Please check your internet connection.'
          };
          showError(errorMessages[event.error] || `Error: ${event.error}`);
          stopCapturing();
        };

        rec.onend = () => {
          if (isActive) {
            setTimeout(() => {
              if (recognition && isActive) {
                try {
                  recognition.start();
                } catch (error) {
                  if (error.name !== 'InvalidStateError') {
                    console.error('Restart failed:', error);
                  }
                }
              }
            }, 100);
          } else {
            updateStatus('Ready', '#ccc');
            statusDiv.classList.remove('status-active');
            cleanupEmptyLines();
          }
        };

        return rec;
      }

      function getBestResult(result) {
        let bestResult = result[0];
        let bestScore = result[0].confidence || 0;

        for (let i = 1; i < result.length; i++) {
          const alternative = result[i];
          const confidence = alternative.confidence || 0;
          const transcript = alternative.transcript.toLowerCase();
          const words = transcript.split(/\s+/);
          const commonWordBonus = words.filter(word => commonWords.has(word)).length * 0.05;
          const adjustedScore = confidence + commonWordBonus;

          if (adjustedScore > bestScore) {
            bestResult = alternative;
            bestScore = adjustedScore;
          }
        }

        return {
          transcript: enhanceText(bestResult.transcript),
          confidence: bestScore
        };
      }

      async function loadAudioDevices() {
        try {
          const tempStream = await navigator.mediaDevices.getUserMedia({audio: true});
          tempStream.getTracks().forEach(track => track.stop());

          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioInputs = devices.filter(device => device.kind === 'audioinput');

          deviceSelect.innerHTML = '<option value="">Select Audio Input</option>';

          if (audioInputs.length === 0) {
            showError('No audio input devices found.');
            startBtn.disabled = true;
            return;
          }

          audioInputs.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.textContent = device.label || `Audio Input ${index + 1}`;
            deviceSelect.appendChild(option);
          });

          updateStatus('Ready', '#ccc');
          startBtn.disabled = false;

        } catch (error) {
          console.error('Error loading audio devices:', error);
          const message = error.name === 'NotAllowedError' 
            ? 'Microphone access denied. Please allow microphone access and try again.'
            : 'Failed to access audio devices.';
          showError(message);
          startBtn.disabled = true;
        }
      }

      function enhanceText(text) {
        if (!text) return '';

        text = text.trim();
        if (!text) return '';

        let words = text.split(/\s+/);
        words = words.map(word => {
          const cleanWord = word.replace(/[.,!?]/g, '').toLowerCase();
          return profanityFilter.has(cleanWord) ? '' : word;
        });
        text = words.filter(w => w).join(' ');

        text = text.replace(/^./, c => c.toUpperCase());
        text = text.replace(/\.\s+./g, m => m.toUpperCase());

        const corrections = {
          ' i ': ' I ',
          ' im ': ' I\'m ',
          ' ive ': ' I\'ve ',
          ' id ': ' I\'d ',
          ' ill ': ' I\'ll ',
          ' cant ': ' can\'t ',
          ' wont ': ' won\'t ',
          ' dont ': ' don\'t ',
          ' isnt ': ' isn\'t ',
          ' arent ': ' aren\'t ',
          ' wasnt ': ' wasn\'t ',
          ' werent ': ' weren\'t ',
          ' hasnt ': ' hasn\'t ',
          ' havent ': ' haven\'t ',
          ' hadnt ': ' hadn\'t ',
          ' wouldnt ': ' wouldn\'t ',
          ' shouldnt ': ' shouldn\'t ',
          ' couldnt ': ' couldn\'t ',
          ' gonna ': ' going to ',
          ' wanna ': ' want to ',
          ' kinda ': ' kind of '
        };

        Object.entries(corrections).forEach(([wrong, right]) => {
          const regex = new RegExp(`\\b${wrong.replace(/'/g, '\'')}\\b`, 'gi');
          text = text.replace(regex, right);
        });

        return text;
      }

      function processTranscript(text, isFinal) {
        const words = text.split(/\s+/).filter(w => w);
        if (words.length) {
          displayWords(words, isFinal);
        }
      }

      function displayWords(words, isFinal) {
        if (transcriptDiv.textContent.includes('Select an audio input')) {
          transcriptDiv.innerHTML = '';
        }

        let currentLine = transcriptDiv.querySelector('.line:last-child');
        if (!currentLine || currentLine.textContent.trim() === '') {
          currentLine?.remove();
          currentLine = createNewLine();
        }

        let lineLength = getCurrentLineLength(currentLine);

        // Remove existing interim words
        if (!isFinal) {
          transcriptDiv.querySelectorAll('.interim').forEach(span => span.remove());
          lineLength = getCurrentLineLength(currentLine);
        }

        words.forEach(word => {
          if (!word) return;
          
          const wordLength = word.length + 1;

          if (lineLength + wordLength > maxLineLength) {
            currentLine = createNewLine();
            lineLength = 0;
          }

          const span = createWordSpan(word, isFinal);
          currentLine.appendChild(span);
          lineLength += wordLength;
        });

        const lines = Array.from(transcriptDiv.querySelectorAll('.line'));
        if (lines.length > maxLines) {
          const linesToRemove = lines.slice(0, lines.length - maxLines);
          linesToRemove.forEach(line => line.remove());
        }

        cleanupEmptyLines();
        transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
      }

      function createNewLine() {
        const line = document.createElement('div');
        line.className = 'line';
        transcriptDiv.appendChild(line);
        return line;
      }

      function getCurrentLineLength(line) {
        return Array.from(line.children)
          .reduce((len, span) => len + span.textContent.length, 0);
      }

      function createWordSpan(word, isFinal) {
        const span = document.createElement('span');
        span.className = 'word';
        if (!isFinal) span.classList.add('interim');
        span.textContent = word + ' ';
        span.addEventListener('click', () => editWord(span));
        return span;
      }

      function editWord(span) {
        const currentText = span.textContent.trim();
        const newText = prompt('Edit word:', currentText);
        if (newText && newText !== currentText) {
          span.textContent = newText + ' ';
        }
      }

      function cleanupEmptyLines() {
        transcriptDiv.querySelectorAll('.line').forEach(line => {
          if (line.textContent.trim() === '') {
            line.remove();
          }
        });
      }

      async function startCapturing() {
        if (!deviceSelect.value) {
          showError('Please select an audio input device.');
          return;
        }

        try {
          stopCapturing();

          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: { exact: deviceSelect.value },
              noiseSuppression: true,
              echoCancellation: true,
              autoGainControl: true,
              sampleRate: 48000
            }
          });

          recognition = initSpeechRecognition();
          recognition.start();
          
          isActive = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          
          transcriptDiv.innerHTML = '';
          finalTranscript = '';
          interimTranscript = '';
          lastUpdateTime = Date.now();
          
        } catch (error) {
          console.error('Error starting capture:', error);
          const errorMessages = {
            'NotAllowedError': 'Microphone access denied.',
            'NotFoundError': 'Selected audio device not found.',
            'OverconstrainedError': 'Selected audio device not available.'
          };
          showError(errorMessages[error.name] || `Error: ${error.message}`);
          stopCapturing();
        }
      }

      function stopCapturing() {
        isActive = false;
        finalTranscript = '';
        interimTranscript = '';

        if (recognition) {
          try {
            recognition.stop();
          } catch (error) {
            console.error('Error stopping recognition:', error);
          }
          recognition = null;
        }

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        startBtn.disabled = false;
        stopBtn.disabled = true;
        updateStatus('Ready', '#ccc');
        if (transcriptDiv.children.length > 0) {
          const line = createNewLine();
          const span = createWordSpan('span');
          span.caption = '[Captions stopped]';
          span.style.color = '#888';
          span.style.fontStyle = 'italic';
          line.appendChild(span);
        }
        cleanupEmptyLines();
      }

      function updateStatus(text, color) {
        statusDiv.textContent = text;
        statusDiv.style.color = color;
      }

      function showError(message) {
        updateStatus(`Error: ${message}`, '#dc3545');
        statusDiv.classList.remove('status-active');
      }

      startBtn.addEventListener('click', startCapturing);
      stopBtn.addEventListener('click', stopCapturing);
      
      if (languageSelect) {
        languageSelect.onchange = () => {
          if (isActive) {
            stopCapturing();
            setTimeout(startCapturing, 100);
          }
        }
      }

      navigator.mediaDevices.addEventListener('devicechange', loadAudioDevices);

      loadAudioDevices();
    })();
  </script>
</body>
</html>
