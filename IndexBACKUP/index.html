<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Audio to Text - Improved</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #616161;
      color: #ebebeb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      background-color: #2d2d2d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      white-space: nowrap;
      margin-right: 10px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-grow: 1;
    }
    #deviceSelect {
      padding: 6px 10px;
      min-width: 200px;
      background: #3d3d3d;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }
    button {
      padding: 6px 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #357abd;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .main-content {
      display: flex;
      flex-grow: 1;
      gap: 20px;
      padding: 20px;
    }
    #transcript {
      flex: 2;
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 30px 40px;
      overflow-y: auto;
      line-height: 1.8;
      font-size: 24px;
      font-family: Arial, sans-serif;
      font-weight: 500;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      letter-spacing: 0.5px;
      border-radius: 8px;
      position: relative;
    }
    .caption-line {
      margin: 8px 0;
      min-height: 1.6em;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      padding: 5px 0;
    }
    .caption-line.line-1 {
      opacity: 0.5;
      font-size: 0.85em;
      color: #999;
    }
    .caption-line.line-2 {
      opacity: 0.75;
      font-size: 0.9em;
      color: #bbb;
    }
    .caption-line.line-3 {
      opacity: 1;
      font-size: 1em;
      font-weight: 600;
      color: white;
    }
    .caption-line.current {
      background: linear-gradient(90deg, transparent, rgba(74, 144, 226, 0.1), transparent);
      border-left: 3px solid #4a90e2;
      padding-left: 15px;
      border-radius: 0 4px 4px 0;
    }
    .interim-text {
      opacity: 0.7;
      color: #ffd700;
      font-style: italic;
    }
    .processing-indicator {
      color: #ff6b6b;
      font-size: 0.8em;
      margin-left: 10px;
    }
    .listening-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #4a90e2;
      border-radius: 50%;
      animation: pulse 1s infinite;
      margin-left: 8px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .history-panel {
      flex: 1;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 8px;
      overflow-y: auto;
      max-height: 600px;
    }
    .history-panel h3 {
      margin: 0 0 15px 0;
      color: #4a90e2;
      font-size: 16px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }
    .history-item {
      background: rgba(255,255,255,0.05);
      margin: 8px 0;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      border-left: 2px solid #4a90e2;
    }
    .history-item .timestamp {
      color: #888;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .stats {
      background: rgba(255,255,255,0.05);
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .stats-item {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
      font-size: 14px;
    }
    .status-panel {
      background: rgba(0,0,0,0.8);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #444;
    }
    #status {
      color: #aaa;
      font-size: 14px;
    }
    .processing-status {
      color: #ffd700;
      font-size: 14px;
    }
    .clear-btn {
      background: #dc3545;
      font-size: 12px;
      padding: 4px 8px;
    }
    .clear-btn:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Live Captions - Enhanced</h1>
    <div class="controls">
      <select id="deviceSelect">
        <option value="">Select Audio Device</option>
      </select>
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
  </div>
  
  <div class="main-content">
    <div id="transcript">
      <div class="caption-line line-1" id="line1">&nbsp;</div>
      <div class="caption-line line-2" id="line2">&nbsp;</div>
      <div class="caption-line line-3 current" id="line3">Select a device and click "Start" to begin transcription.</div>
    </div>
    
    <div class="history-panel">
      <h3>Transcript History</h3>
      <div class="stats">
        <div class="stats-item">
          <span>Lines Processed:</span>
          <span id="lineCount">0</span>
        </div>
        <div class="stats-item">
          <span>Words Captured:</span>
          <span id="wordCount">0</span>
        </div>
        <div class="stats-item">
          <span>Session Duration:</span>
          <span id="sessionTime">00:00</span>
        </div>
        <button class="clear-btn" id="clearHistory">Clear History</button>
      </div>
      <div id="historyContainer">
        <div style="color: #888; font-style: italic; text-align: center; padding: 20px;">
          No transcript history yet. Start recording to see processed lines here.
        </div>
      </div>
    </div>
  </div>

  <div class="status-panel">
    <div id="status">Ready to start</div>
    <div class="processing-status" id="processingStatus"></div>
  </div>

  <script>
    (function() {
      const deviceSelect = document.getElementById('deviceSelect');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const transcriptDiv = document.getElementById('transcript');
      const statusDiv = document.getElementById('status');
      const processingStatusDiv = document.getElementById('processingStatus');
      const lineCountSpan = document.getElementById('lineCount');
      const wordCountSpan = document.getElementById('wordCount');
      const sessionTimeSpan = document.getElementById('sessionTime');
      const historyContainer = document.getElementById('historyContainer');
      const clearHistoryBtn = document.getElementById('clearHistory');
      
      let recognition = null;
      let stream = null;
      let sessionStartTime = null;
      let sessionTimer = null;
      
      // Enhanced state management
      let currentTranscript = '';
      let lastFinalTranscript = '';
      let lineHistory = [];
      let totalLinesProcessed = 0;
      let totalWordsProcessed = 0;
      let currentLineBuffer = '';
      let isProcessingFinal = false;
      
      const MAX_LINE_LENGTH = 60;
      const line1 = document.getElementById('line1');
      const line2 = document.getElementById('line2');
      const line3 = document.getElementById('line3');

      // Security and compatibility checks
      if (!window.isSecureContext) {
        statusDiv.innerHTML = 'Error: This page must be served over HTTPS or localhost for microphone access.';
        startBtn.disabled = true;
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        statusDiv.innerHTML = 'Error: Speech recognition not supported. Please use Chrome or Edge.';
        startBtn.disabled = true;
        return;
      }

      // Profanity filter (simplified for demo - you can expand this)
      const PROFANITY_WORDS = ['fuck', 'shit', 'damn', 'bitch', 'ass', 'hell'];
      function censorText(text) {
        if (!text) return text;
        let result = text;
        PROFANITY_WORDS.forEach(word => {
          const regex = new RegExp(word, 'gi');
          result = result.replace(regex, '*'.repeat(word.length));
        });
        return result;
      }

      // Session timer
      function updateSessionTimer() {
        if (sessionStartTime) {
          const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
          const minutes = Math.floor(elapsed / 60);
          const seconds = elapsed % 60;
          sessionTimeSpan.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
      }

      // Add to history with timestamp
      function addToHistory(text) {
        if (!text.trim()) return;
        
        const timestamp = new Date().toLocaleTimeString();
        const historyItem = {
          text: text.trim(),
          timestamp: timestamp,
          id: Date.now()
        };
        
        lineHistory.push(historyItem);
        totalLinesProcessed++;
        
        // Count words
        const words = text.trim().split(/\s+/).filter(w => w.length > 0);
        totalWordsProcessed += words.length;
        
        // Update UI
        lineCountSpan.textContent = totalLinesProcessed;
        wordCountSpan.textContent = totalWordsProcessed;
        
        // Add to history display
        updateHistoryDisplay();
      }

      // Update history display
      function updateHistoryDisplay() {
        if (lineHistory.length === 0) {
          historyContainer.innerHTML = '<div style="color: #888; font-style: italic; text-align: center; padding: 20px;">No transcript history yet.</div>';
          return;
        }
        
        // Show last 20 items
        const recentHistory = lineHistory.slice(-20).reverse();
        historyContainer.innerHTML = recentHistory.map(item => `
          <div class="history-item">
            <div class="timestamp">${item.timestamp}</div>
            <div>${censorText(item.text)}</div>
          </div>
        `).join('');
        
        // Auto-scroll to top of history
        historyContainer.scrollTop = 0;
      }

      // Move caption lines up
      function moveLinesUp() {
        // Save line 1 to history before moving
        const line1Text = line1.textContent.trim();
        if (line1Text && line1Text !== '&nbsp;' && line1Text !== '\u00A0') {
          addToHistory(line1Text);
        }
        
        // Move lines up
        line1.textContent = line2.textContent;
        line2.textContent = line3.textContent;
        line3.textContent = '';
        
        // Update styling
        line1.classList.remove('current');
        line2.classList.remove('current');
        line3.classList.add('current');
      }

      // Process and display text
      function updateCaptions(transcript, isFinal) {
        if (!transcript.trim()) return;
        
        const cleanTranscript = censorText(transcript);
        
        if (isFinal) {
          isProcessingFinal = true;
          processingStatusDiv.textContent = 'Processing final result...';
          
          // Get only the new part since last final result
          const newText = cleanTranscript.substring(lastFinalTranscript.length).trim();
          
          if (newText) {
            // Clear any interim display
            line3.innerHTML = '';
            
            // Add new text to current line buffer
            currentLineBuffer += (currentLineBuffer ? ' ' : '') + newText;
            
            // Break into lines if needed
            while (currentLineBuffer.length > MAX_LINE_LENGTH) {
              const breakPoint = findGoodBreakPoint(currentLineBuffer, MAX_LINE_LENGTH);
              const lineText = currentLineBuffer.substring(0, breakPoint).trim();
              
              // Display this line
              line3.textContent = lineText;
              moveLinesUp();
              
              // Keep remaining text for next line
              currentLineBuffer = currentLineBuffer.substring(breakPoint).trim();
            }
            
            // Display remaining text on current line
            if (currentLineBuffer) {
              line3.textContent = currentLineBuffer;
            }
            
            lastFinalTranscript = cleanTranscript;
          }
          
          isProcessingFinal = false;
          processingStatusDiv.textContent = '';
          
        } else {
          // Interim result - show with indicator
          if (!isProcessingFinal) {
            const newInterimText = cleanTranscript.substring(lastFinalTranscript.length).trim();
            if (newInterimText) {
              const currentLine = currentLineBuffer || '';
              const displayText = currentLine + (currentLine ? ' ' : '') + newInterimText;
              
              line3.innerHTML = displayText + ' <span class="listening-indicator"></span>';
              processingStatusDiv.textContent = 'Listening...';
            }
          }
        }
      }

      // Find good break point for line wrapping
      function findGoodBreakPoint(text, maxLength) {
        if (text.length <= maxLength) return text.length;
        
        // Try to break at punctuation
        const punctuation = /[.!?;,]/g;
        let bestBreak = maxLength;
        let match;
        
        while ((match = punctuation.exec(text)) !== null) {
          if (match.index < maxLength && match.index > maxLength * 0.7) {
            bestBreak = match.index + 1;
          }
        }
        
        // If no good punctuation break, try word boundary
        if (bestBreak === maxLength) {
          const lastSpace = text.lastIndexOf(' ', maxLength);
          if (lastSpace > maxLength * 0.7) {
            bestBreak = lastSpace;
          }
        }
        
        return bestBreak;
      }

      // Load audio devices
      async function loadDevices() {
        try {
          // Request permission first
          try {
            const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            tempStream.getTracks().forEach(track => track.stop());
          } catch (err) {
            statusDiv.textContent = 'Please allow microphone access to continue.';
            return;
          }

          const devices = await navigator.mediaDevices.enumerateDevices();
          const audioDevices = devices.filter(device => device.kind === 'audioinput');
          
          deviceSelect.innerHTML = '<option value="">Select a device</option>';
          
          if (!audioDevices.length) {
            statusDiv.textContent = 'No audio input devices found.';
            return;
          }
          
          audioDevices.forEach(device => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Microphone ${deviceSelect.length}`;
            deviceSelect.appendChild(option);
          });
          
          statusDiv.textContent = 'Ready to start - select device and click Start';
          
        } catch (err) {
          statusDiv.textContent = `Error loading devices: ${err.message}`;
        }
      }

      // Start transcription
      async function startTranscription() {
        if (!deviceSelect.value) {
          statusDiv.textContent = 'Please select an audio device.';
          return;
        }

        try {
          // Get audio stream
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { 
              deviceId: { exact: deviceSelect.value },
              noiseSuppression: true,
              echoCancellation: true,
              autoGainControl: true
            }
          });

          // Create speech recognition
          recognition = new SpeechRecognition();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = 'en-US';
          recognition.maxAlternatives = 1;

          recognition.onstart = () => {
            statusDiv.textContent = 'Listening...';
            processingStatusDiv.textContent = 'Ready for speech';
            sessionStartTime = Date.now();
            sessionTimer = setInterval(updateSessionTimer, 1000);
          };

          recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            // Process all results
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0].transcript;
              
              if (event.results[i].isFinal) {
                finalTranscript += transcript;
              } else {
                interimTranscript += transcript;
              }
            }

            // Update display
            if (finalTranscript) {
              updateCaptions(currentTranscript + finalTranscript, true);
              currentTranscript += finalTranscript;
            } else if (interimTranscript) {
              updateCaptions(currentTranscript + interimTranscript, false);
            }
          };

          recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            statusDiv.textContent = `Error: ${event.error}`;
            stopTranscription();
          };

          recognition.onend = () => {
            if (startBtn.disabled) {
              // Auto-restart if still supposed to be running
              setTimeout(() => {
                if (recognition && startBtn.disabled) {
                  try {
                    recognition.start();
                  } catch (err) {
                    console.error('Error restarting:', err);
                    stopTranscription();
                  }
                }
              }, 100);
            }
          };

          recognition.start();
          
          // Update UI
          startBtn.disabled = true;
          stopBtn.disabled = false;
          
          // Reset display
          line1.textContent = '\u00A0';
          line2.textContent = '\u00A0';
          line3.innerHTML = 'Listening... <span class="listening-indicator"></span>';
          
          // Reset state
          currentTranscript = '';
          lastFinalTranscript = '';
          currentLineBuffer = '';
          
        } catch (err) {
          console.error('Error starting transcription:', err);
          statusDiv.textContent = `Error: ${err.message}`;
        }
      }

      // Stop transcription
      function stopTranscription() {
        if (recognition) {
          recognition.stop();
          recognition = null;
        }
        
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        
        if (sessionTimer) {
          clearInterval(sessionTimer);
          sessionTimer = null;
        }
        
        // Finalize any remaining text
        if (currentLineBuffer.trim()) {
          line3.textContent = currentLineBuffer;
          moveLinesUp();
          currentLineBuffer = '';
        }
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusDiv.textContent = 'Transcription stopped.';
        processingStatusDiv.textContent = '';
        
        line3.textContent = 'Transcription stopped. Click Start to resume.';
      }

      // Clear history
      function clearHistory() {
        lineHistory = [];
        totalLinesProcessed = 0;
        totalWordsProcessed = 0;
        lineCountSpan.textContent = '0';
        wordCountSpan.textContent = '0';
        updateHistoryDisplay();
      }

      // Event listeners
      startBtn.addEventListener('click', startTranscription);
      stopBtn.addEventListener('click', stopTranscription);
      clearHistoryBtn.addEventListener('click', clearHistory);
      
      // Initialize
      loadDevices();
      
    })();
  </script>
</body>
</html>
