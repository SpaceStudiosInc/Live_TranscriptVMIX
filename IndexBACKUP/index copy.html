<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Audio to Text</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #616161;
      color: #ebebeb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      background-color: #2d2d2d;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      white-space: nowrap;
      margin-right: 10px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-grow: 1;
    }
    #deviceSelect {
      padding: 6px 10px;
      min-width: 200px;
      background: #3d3d3d;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }
    button {
      padding: 6px 12px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #357abd;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #transcript {
      flex-grow: 1;
      background-color: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 30px 40px;
      overflow-y: auto;
      line-height: 1.8;
      font-size: 24px;
      font-family: Arial, sans-serif;
      font-weight: 500;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      letter-spacing: 0.5px;
    }
    .caption-line {
      margin: 4px 0;
      min-height: 1.6em;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
    }
    .caption-line.line-1 {
      opacity: 0.6;
      font-size: 0.9em;
    }
    .caption-line.line-2 {
      opacity: 0.8;
      font-size: 0.95em;
    }
    .caption-line.line-3 {
      opacity: 1;
      font-size: 1em;
      font-weight: 600;
    }
    .caption-line.current {
      background: linear-gradient(90deg, transparent, rgba(74, 144, 226, 0.1), transparent);
      border-left: 3px solid #4a90e2;
      padding-left: 15px;
    }
    #startBtn, #stopBtn {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #startBtn:disabled, #stopBtn:disabled {
      cursor: not-allowed;
      background-color: #ccc;
    }
    #status {
      color: #d9534f;
      margin: 10px 0;
      font-size: 14px;
    }
    .history-indicator {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Live Captions</h1>
    <div class="controls">
      <select id="deviceSelect">
        <option value="">Select Audio Device</option>
      </select>
      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>
      <div id="status" style="margin-left: auto; color: #aaa; font-size: 14px;">Ready</div>
    </div>
  </div>
  
  <div id="transcript">
    <div class="caption-line line-1" id="line1">&nbsp;</div>
    <div class="caption-line line-2" id="line2">&nbsp;</div>
    <div class="caption-line line-3 current" id="line3">Select a device and click "Start Transcription".</div>
  </div>

  <div class="history-indicator" id="historyIndicator">
    Lines processed: <span id="lineCount">0</span>
  </div>

  <script>
    (function() {
      const deviceSelect = document.getElementById('deviceSelect');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const transcriptDiv = document.getElementById('transcript');
      const statusDiv = document.getElementById('status');
      const lineCountSpan = document.getElementById('lineCount');
      
      let recognition = null;
      let stream = null;
      
      // Caption management
      let currentText = '';
      let pendingWords = [];
      let isProcessing = false;
      let lineHistory = [];
      let totalLinesProcessed = 0;
      let wordQueue = [];
      let isDisplayingWords = false;
      
      const MAX_LINE_LENGTH = 60; // Characters per line
      const WORD_DELAY = 150; // ms between words when building line
      
      // Line elements
      const line1 = document.getElementById('line1');
      const line2 = document.getElementById('line2');
      const line3 = document.getElementById('line3');

      // Check secure context
      if (!window.isSecureContext) {
        const isLocalhost = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1';
        let errorMessage = 'Error: This page must be served over HTTPS or localhost.\n\n';
        if (isLocalhost) {
          errorMessage += 'You appear to be running this locally. ';
        } else {
          errorMessage += 'To use this application, you need to either:\n';
          errorMessage += '1. Serve it over HTTPS (recommended for production)\n';
          errorMessage += '2. Run it on localhost (for development)\n\n';
          errorMessage += 'To run locally, you can use Python\'s built-in server:\n';
          errorMessage += '1. Open terminal in this folder\n';
          errorMessage += '2. Run: python3 -m http.server 8000\n';
          errorMessage += '3. Open http://localhost:8000 in your browser\n';
        }
        statusDiv.innerHTML = errorMessage.replace(/\n/g, '<br>') + 
          '<br><br><button id="copyCmd" style="padding: 8px 16px; background: #5cb85c; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px;">' +
          'Copy Local Server Command</button>';
        document.getElementById('copyCmd')?.addEventListener('click', () => {
          navigator.clipboard.writeText('python3 -m http.server 8000')
            .then(() => alert('Command copied to clipboard! Run this in your terminal.'))
            .catch(err => console.error('Failed to copy:', err));
        });
        startBtn.disabled = true;
        return;
      }

      // Check Web Speech API
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        const isEdge = /Edg/.test(navigator.userAgent);
        let message = 'Error: Speech recognition is not supported in this browser. ';
        if (!isChrome && !isEdge) {
          message += 'Please use Google Chrome or Microsoft Edge for the best experience. ';
          message += 'Other browsers may have limited or no support for the Web Speech API.';
        } else {
          message += 'Please ensure you are using the latest version of your browser.';
        }
        statusDiv.innerHTML = message + '<br><br>Your browser: ' + navigator.userAgent;
        startBtn.disabled = true;
        return;
      }

      // Initialize speech recognition
      function createRecognition() {
        try {
          if (!window.webkitSpeechRecognition && !window.SpeechRecognition) {
            throw new Error('Speech recognition not supported in this browser');
          }
          const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.lang = 'en-US';
          recognition.onerror = (event) => {
            console.error('Recognition error:', event.error, event.message);
            if (event.error === 'service-not-allowed') {
              statusDiv.innerHTML = `
                <div style="color: #d9534f; margin-bottom: 15px;">
                  <strong>Speech Recognition Blocked:</strong> Please enable speech recognition in your browser settings.
                </div>
                <div style="background: #f8f9fa; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 14px;">
                  <strong>To enable in Chrome/Edge:</strong><br>
                  1. Click the lock icon in the address bar<br>
                  2. Click "Site settings"<br>
                  3. Set "Speech recognition" to "Allow"<br>
                  4. Refresh the page and try again
                </div>
                <button id="retryBtn" style="padding: 8px 16px; background: #5cb85c; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
                  I've enabled it, try again
                </button>
              `;
              document.getElementById('retryBtn')?.addEventListener('click', () => {
                window.location.reload();
              });
            }
            stopTranscription();
          };
          return recognition;
        } catch (err) {
          console.error('Error creating speech recognition:', err);
          statusDiv.innerHTML = `
            <div style="color: #d9534f;">
              <strong>Error:</strong> ${err.message || 'Failed to initialize speech recognition'}
            </div>
          `;
          return null;
        }
      }

      // Check WebRTC support
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusDiv.innerText = 'Error: Audio capture not supported. This browser does not support WebRTC.';
        startBtn.disabled = true;
        return;
      }

      // Load audio devices
      async function loadDevices() {
        try {
          let devices = [];
          try {
            devices = await navigator.mediaDevices.enumerateDevices();
            console.log('Initial devices:', devices.filter(d => d.kind === 'audioinput'));
          } catch (err) {
            console.log('Initial device enumeration failed, will try with permission');
          }
          if (!devices.some(device => device.kind === 'audioinput' && device.label)) {
            try {
              const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
              tempStream.getTracks().forEach(track => track.stop());
              devices = await navigator.mediaDevices.enumerateDevices();
              console.log('Devices after permission:', devices.filter(d => d.kind === 'audioinput'));
            } catch (err) {
              console.error('Error getting microphone permission:', err);
              statusDiv.innerHTML = `
                <div style="color: #d9534f; margin-bottom: 10px;">
                  <strong>Microphone access required:</strong> Please allow microphone access to continue.
                </div>
                <button id="retryPermission" style="padding: 8px 16px; background: #5cb85c; color: white; border: none; border-radius: 4px; cursor: pointer;">
                  Grant Microphone Permission
                </button>
              `;
              document.getElementById('retryPermission')?.addEventListener('click', loadDevices);
              return;
            }
          }
          const audioDevices = devices.filter(device => device.kind === 'audioinput');
          deviceSelect.innerHTML = '<option value="">Select a device</option>';
          if (!audioDevices.length) {
            statusDiv.innerText = 'Error: No audio input devices found. Please connect a microphone.';
            startBtn.disabled = true;
            return;
          }
          audioDevices.forEach(device => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Microphone ${deviceSelect.length + 1}`;
            deviceSelect.appendChild(option);
          });
          statusDiv.innerText = 'Please select a device and allow microphone access.';
        } catch (err) {
          statusDiv.innerText = `Error loading devices: ${err.name}. Please allow microphone access.`;
          startBtn.disabled = true;
          console.error('Device error:', err);
        }
      }

      // Profanity filter
      const PROFANITY_LIST = [
        'fuck', 'motherfucker', 'fucker', 'fucking', 'cunt', 'cocksucker', 'faggot', 'fag', 'nigger', 'nigga', 'chink', 'spic', 'kike', 'retard',
        'shit', 'shitty', 'shithead', 'shitbag', 'shitface', 'shithole', 'shithouse', 'shitfaced', 'shitter',
        'bitch', 'bitches', 'bitchass', 'dick', 'dickhead', 'dickbag', 'prick', 'cock', 'asshole', 'ass', 'arsehole', 'arse', 'jackass', 'smartass', 'dumbass', 'badass', 'punkass',
        'crap', 'piss', 'pissed', 'pissing', 'damn', 'dammit', 'bollocks', 'bugger', 'wank', 'wanker', 'wankstain', 'tosser', 'twat',
        'boner', 'cum', 'jizz', 'jiz', 'jism', 'clit', 'pussy', 'tits', 'titties', 'titty', 'boobs', 'boobies', 'dildo', 'blowjob', 'rimjob', 'handjob', 'anal',
        'slut', 'whore', 'whorebag', 'whoreface', 'skank', 'slag', 'tramp', 'sket', 'slapper', 'hoe', 'ho',
        'bastard', 'minge', 'munter', 'plonker', 'knob', 'bellend', 'git', 'prat', 'bint', 'nonce', 'jerkoff',
        'fuckface', 'fuckhead', 'fuckboy', 'asswipe', 'assface', 'dipshit', 'bullshit', 'bollux', 'bollox', 'feck',
        'crapola', 'crud', 'frick', 'fudge', 'heck', 'darn', 'bloody', 'blimey', 'bloody', 'boner'
      ];

      function censorText(text) {
        if (!text) return text;
        const tokens = text.split(/(\s+)/);
        return tokens.map(token => {
          if (/^\s+$/.test(token)) return token;
          const lowerToken = token.toLowerCase();
          const isProfane = PROFANITY_LIST.some(profanity => 
            lowerToken.includes(profanity)
          );
          return isProfane ? '*'.repeat(token.length) : token;
        }).join('');
      }

      // Move lines up (TV caption style)
      function moveLinesUp() {
        // Store current line 1 in history
        const line1Text = line1.textContent.trim();
        if (line1Text && line1Text !== '&nbsp;') {
          lineHistory.push(line1Text);
          totalLinesProcessed++;
          lineCountSpan.textContent = totalLinesProcessed;
        }
        
        // Move lines up
        line1.textContent = line2.textContent;
        line2.textContent = line3.textContent;
        line3.textContent = '';
        
        // Update current indicator
        line1.classList.remove('current');
        line2.classList.remove('current');
        line3.classList.add('current');
      }

      // Add text to current line (line 3)
      function addToCurrentLine(text) {
        const currentLine3Text = line3.textContent.trim();
        const newText = currentLine3Text ? currentLine3Text + ' ' + text : text;
        
        if (newText.length > MAX_LINE_LENGTH) {
          // Need to move to next line
          moveLinesUp();
          line3.textContent = text;
        } else {
          line3.textContent = newText;
        }
      }

      // Process a complete sentence word by word
      function processSentence(sentence) {
        if (!sentence.trim()) return;
        
        const cleanSentence = censorText(sentence.trim());
        const words = cleanSentence.split(/\s+/).filter(w => w.length > 0);
        
        if (words.length === 0) return;
        
        // Add words to the queue for word-by-word display
        wordQueue.push(...words);
        
        // Start displaying words if not already doing so
        if (!isDisplayingWords) {
          displayNextWord();
        }
      }

      // Display words one by one with typewriter effect
      function displayNextWord() {
        if (wordQueue.length === 0) {
          isDisplayingWords = false;
          line3.style.opacity = '1'; // Reset opacity when done
          return;
        }
        
        isDisplayingWords = true;
        line3.style.opacity = '1'; // Ensure full opacity during display
        const nextWord = wordQueue.shift();
        
        // Get current line 3 text (remove listening indicator if present)
        let currentLine3Text = line3.textContent.trim();
        if (currentLine3Text === '●') {
          currentLine3Text = '';
        }
        
        const testText = currentLine3Text ? currentLine3Text + ' ' + nextWord : nextWord;
        
        // Check if we need to move to next line
        if (testText.length > MAX_LINE_LENGTH && currentLine3Text) {
          // Move lines up and put word on new line
          moveLinesUp();
          line3.textContent = nextWord;
        } else {
          // Add word to current line
          line3.textContent = testText;
        }
        
        // Schedule next word
        setTimeout(() => {
          displayNextWord();
        }, WORD_DELAY);
      }

      // Process a sentence that's too long for one line
      function processLongSentence(words) {
        let currentLineText = '';
        
        for (const word of words) {
          const testText = currentLineText ? currentLineText + ' ' + word : word;
          
          if (testText.length > MAX_LINE_LENGTH && currentLineText) {
            // Current line is full, set it and move to next line
            line3.textContent = currentLineText;
            moveLinesUp();
            currentLineText = word;
          } else {
            currentLineText = testText;
          }
        }
        
        // Set the final line with remaining text
        if (currentLineText) {
          line3.textContent = currentLineText;
        }
      }

      // Update captions with interim or final text
      function updateCaptions(text, isFinal) {
        if (!text.trim()) return;
        
        if (isFinal) {
          // Process final text word by word
          processSentence(ensurePunctuation(text));
        } else {
          // For interim results, show a subtle indicator that we're listening
          // but don't display the actual interim text
          const currentLine3Text = line3.textContent.trim();
          if (!isDisplayingWords && !currentLine3Text) {
            line3.style.opacity = '0.7';
            line3.textContent = '●'; // Small dot to show we're listening
          }
        }
      }

      // Start transcription
      async function startTranscription() {
        if (!deviceSelect.value) {
          statusDiv.innerText = 'Please select an audio device.';
          return;
        }
        if (recognition) {
          try {
            recognition.stop();
          } catch (e) {}
          recognition = null;
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { 
              deviceId: deviceSelect.value ? { exact: deviceSelect.value } : undefined,
              noiseSuppression: false,
              echoCancellation: false
            }
          });
          recognition = createRecognition();
          recognition.onresult = event => {
            const result = event.results[event.results.length - 1];
            const text = result[0].transcript;
            updateCaptions(text, result.isFinal);
          };
          recognition.onend = () => {
            if (startBtn.disabled) {
              setTimeout(() => {
                if (recognition && startBtn.disabled) {
                  try {
                    recognition.start();
                  } catch (err) {
                    console.error('Error restarting recognition:', err);
                    statusDiv.innerHTML = `
                      <div style="color: #d9534f; margin-bottom: 10px;">
                        Error restarting speech recognition. Please refresh the page.
                      </div>
                    `;
                    stopTranscription();
                  }
                }
              }, 100);
            }
          };
          recognition.start();
          startBtn.disabled = true;
          stopBtn.disabled = false;
          statusDiv.innerHTML = '<div style="color: #5cb85c;">Listening... Speak now.</div>';
          
          // Reset display
          line1.textContent = '\u00A0';
          line2.textContent = '\u00A0';
          line3.textContent = '';
          line3.classList.add('current');
          
        } catch (err) {
          console.error('Error starting transcription:', err);
          statusDiv.innerHTML = `
            <div style="color: #d9534f; margin-bottom: 10px;">
              <strong>Error:</strong> ${err.message || 'Failed to access microphone'}
            </div>
            <button id="retryBtn" style="padding: 8px 16px; background: #5cb85c; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
              Try Again
            </button>
          `;
          document.getElementById('retryBtn')?.addEventListener('click', startTranscription);
          stopTranscription();
        }
      }

      // Stop transcription
      function stopTranscription() {
        if (recognition) {
          recognition.stop();
          recognition = null;
        }
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }
        
        // Clear any pending words
        wordQueue = [];
        isDisplayingWords = false;
        
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusDiv.innerText = 'Transcription stopped.';
        
        // Show stopped message after current words finish
        setTimeout(() => {
          if (!isDisplayingWords) {
            moveLinesUp();
            line3.textContent = 'Transcription stopped.';
            line3.classList.add('current');
            line3.style.opacity = '1';
          }
        }, 300);
      }

      // Event listeners
      startBtn.addEventListener('click', startTranscription);
      stopBtn.addEventListener('click', stopTranscription);
      navigator.mediaDevices.addEventListener('devicechange', loadDevices);

      // Add punctuation
      function ensurePunctuation(text) {
        if (!text) return text;
        const trimmed = text.trim();
        const lastChar = trimmed.slice(-1);
        if (!['.', '!', '?', ','].includes(lastChar)) {
          return trimmed + '.';
        }
        return trimmed;
      }

      // Initialize
      loadDevices();
      
      // Debug: Add click handler to show history
      transcriptDiv.addEventListener('dblclick', () => {
        if (lineHistory.length > 0) {
          alert('Caption History:\n\n' + lineHistory.slice(-10).join('\n'));
        } else {
          alert('No caption history yet.');
        }
      });

    })();
  </script>
</body>
</html>
